<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  .strip{display:flex;gap:14px;padding:10px;align-items:center;background:#fff;width:max-content}
  .strip.dark{background:#1f2937}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px}
  .cap{font:10px/1 -apple-system,sans-serif;color:#6b7280}
  .strip.dark .cap{color:#9ca3af}
  img{display:block}
  .s81{width:81px;height:81px}
  .s27{width:27px;height:27px}
  .s54{width:54px;height:54px}
  .bar{display:flex;gap:28px;padding:6px 12px 4px;background:#fff;width:max-content;align-items:flex-end}
  .bar .item{display:flex;flex-direction:column;align-items:center;gap:2px}
  .bar .t{font:11px/1 -apple-system,"PingFang SC",sans-serif;color:#94a3b8}
  .bar .t.on{color:#2563eb;font-weight:600}
</style></head>
<body>
<div class="strip">
  <div class="cell"><img class="s81" src="tabbar-svg/room.svg"><span class="cap">room 81</span></div>
  <div class="cell"><img class="s81" src="tabbar-svg/room-active.svg"><span class="cap">room-act 81</span></div>
  <div class="cell"><img class="s81" src="tabbar-svg/booking.svg"><span class="cap">booking 81</span></div>
  <div class="cell"><img class="s81" src="tabbar-svg/booking-active.svg"><span class="cap">booking-act 81</span></div>
  <div class="cell"><img class="s81" src="tabbar-svg/mine.svg"><span class="cap">mine 81</span></div>
  <div class="cell"><img class="s81" src="tabbar-svg/mine-active.svg"><span class="cap">mine-act 81</span></div>
</div>
<div class="strip">
  <div class="cell"><img class="s54" src="tabbar-svg/room.svg"><span class="cap">54</span></div>
  <div class="cell"><img class="s54" src="tabbar-svg/room-active.svg"><span class="cap">54</span></div>
  <div class="cell"><img class="s54" src="tabbar-svg/booking.svg"><span class="cap">54</span></div>
  <div class="cell"><img class="s54" src="tabbar-svg/booking-active.svg"><span class="cap">54</span></div>
  <div class="cell"><img class="s54" src="tabbar-svg/mine.svg"><span class="cap">54</span></div>
  <div class="cell"><img class="s54" src="tabbar-svg/mine-active.svg"><span class="cap">54</span></div>
</div>
<div class="strip">
  <div class="cell"><img class="s27" src="tabbar-svg/room.svg"><span class="cap">27</span></div>
  <div class="cell"><img class="s27" src="tabbar-svg/room-active.svg"><span class="cap">27</span></div>
  <div class="cell"><img class="s27" src="tabbar-svg/booking.svg"><span class="cap">27</span></div>
  <div class="cell"><img class="s27" src="tabbar-svg/booking-active.svg"><span class="cap">27</span></div>
  <div class="cell"><img class="s27" src="tabbar-svg/mine.svg"><span class="cap">27</span></div>
  <div class="cell"><img class="s27" src="tabbar-svg/mine-active.svg"><span class="cap">27</span></div>
</div>
<div class="bar">
  <div class="item"><img class="s27" src="tabbar-svg/room-active.svg"><span class="t on">会议室</span></div>
  <div class="item"><img class="s27" src="tabbar-svg/booking.svg"><span class="t">我的预约</span></div>
  <div class="item"><img class="s27" src="tabbar-svg/mine.svg"><span class="t">我的</span></div>
</div>
</body></html>
