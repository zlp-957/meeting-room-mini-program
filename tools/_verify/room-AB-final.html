<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* A/B 终裁：393px；数据取 backend/src/main/resources/sql/init.sql 的「多功能厅」 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef1f6; padding: 14px; }
  .row { display: flex; gap: 20px; }
  .panel { width: 393px; height: 520px; position: relative; overflow: hidden; background: #f5f6f8;
    border-radius: 12px; box-shadow: 0 4px 18px rgba(15,23,42,.08); }
  .tag { position: absolute; top: 8px; left: 8px; font-size: 11px; color: #fff; background: rgba(15,23,42,.6);
    padding: 3px 8px; border-radius: 10px; z-index: 5; }
  .hero { padding: 29px 21px 42px;
    background: linear-gradient(180deg, #2563eb 0%, #2258dd 55%, #1d4ed8 100%);
    border-radius: 0 0 21px 21px; margin-bottom: -25px; }
  .room-name { font-size: 25px; font-weight: 700; color: #fff; letter-spacing: .5px; }
  .hero-meta { display: flex; align-items: center; margin-top: 10px; }
  .capacity-pill { font-size: 12px; color: #2563eb; background: #fff; padding: 4px 10px; border-radius: 12px;
    font-weight: 500; box-shadow: 0 2px 6px rgba(29,78,216,.18); }
  .hero-hours { font-size: 12.6px; color: rgba(255,255,255,.9); margin-left: 9px; }
  .info-card { background: #fff; border-radius: 13px; margin: 0 17px 10px; padding: 3px 15px;
    box-shadow: 0 2px 8px rgba(17,24,39,.06); }

  /* ===== A 案：体验侧 v3 定稿（68px 标签列 / px 字号 / 双档行高） ===== */
  .a .info-item { display: flex; align-items: baseline; padding: 14px 0; }
  .a .info-item + .info-item { border-top: 1px solid #F2F4F7; }
  .a .info-label { flex: 0 0 68px; font-size: 13px; line-height: 1.5; color: #6C7486; white-space: nowrap; }
  .a .info-value { flex: 1; min-width: 0; font-size: 14px; line-height: 1.5; color: #1F2937; text-align: left; }
  .a .info-value.remark { line-height: 1.75; color: #4B5563; }

  /* ===== B 案：备注堆叠（当前实现） ===== */
  .b .info-item { display: flex; justify-content: space-between; align-items: baseline; padding: 15px 0;
    border-bottom: 1px solid #f2f4f7; }
  .b .info-item:last-child { border-bottom: none; }
  .b .info-label { flex-shrink: 0; font-size: 14.1px; line-height: 1.5; color: #6c7486; }
  .b .info-value { font-size: 14.1px; color: #1f2937; text-align: right; max-width: 263px; line-height: 1.5;
    min-width: 0; }
  .b .info-item.is-block { display: block; }
  .b .info-item.is-block .info-label { display: block; font-size: 13.1px; line-height: 1.4; color: #6c7486; }
  .b .info-item.is-block .info-value { display: block; margin-top: 7px; max-width: none; text-align: left;
    color: #4b5563; line-height: 1.75; white-space: pre-wrap; }
</style>
</head>
<body>
  <div class="row">
    <div class="panel a">
      <div class="tag">A 案 · 三行统一左轴（两位成员定稿）</div>
      <div class="hero"><div class="room-name">多功能厅</div>
        <div class="hero-meta"><div class="capacity-pill">可容纳 20 人</div><div class="hero-hours">开放 08:00 - 22:00</div></div></div>
      <div class="info-card">
        <div class="info-item"><div class="info-label">位置</div><div class="info-value">B栋 1楼 101</div></div>
        <div class="info-item"><div class="info-label">开放时间</div><div class="info-value">08:00 - 22:00</div></div>
        <div class="info-item"><div class="info-label">备注</div><div class="info-value remark">大型会议室；配备：投影仪、视频会议、音响、电视</div></div>
      </div>
    </div>

    <div class="panel b">
      <div class="tag">B 案 · 备注堆叠，前两行不动（我的方案）</div>
      <div class="hero"><div class="room-name">多功能厅</div>
        <div class="hero-meta"><div class="capacity-pill">可容纳 20 人</div><div class="hero-hours">开放 08:00 - 22:00</div></div></div>
      <div class="info-card">
        <div class="info-item"><div class="info-label">位置</div><div class="info-value">B栋 1楼 101</div></div>
        <div class="info-item"><div class="info-label">开放时间</div><div class="info-value">08:00 - 22:00</div></div>
        <div class="info-item is-block"><div class="info-label">备注</div><div class="info-value">大型会议室；配备：投影仪、视频会议、音响、电视</div></div>
      </div>
    </div>
  </div>
</body>
</html>
